services:
  postgres:
    image: postgres:16-alpine
    container_name: leaveflow-postgres
    environment:
      POSTGRES_DB: leaveflow
      POSTGRES_USER: leaveflow
      POSTGRES_PASSWORD: leaveflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leaveflow -d leaveflow"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
