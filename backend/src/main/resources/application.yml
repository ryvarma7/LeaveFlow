spring:
  application:
    name: leaveflow-backend
  profiles:
    active: demo
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/leaveflow}
    username: ${DB_USER:leaveflow}
    password: ${DB_PASSWORD:leaveflow}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

leave:
  timezone: ${LEAVE_TIMEZONE:Asia/Kolkata}
  jwt:
    secret: ${JWT_SECRET:super-secret-key-that-is-at-least-32-bytes-long-for-hs256-signing}
    expiration-minutes: 60
  coverage:
    allowance-percent-of-daily-rate: 20
    monthly-cap-days: 5
  payroll:
    scale: 2
  escalation:
    manager-timeout-seconds: 172800 # 48h
    skip-level-timeout-seconds: 86400 # 24h
    hr-timeout-seconds: 86400 # 24h
    poll-interval-seconds: 60
  internal:
    cron-secret: ${CRON_SECRET:demo-cron-secret-12345}
